name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/ExcelReportTool -c Release
      - name: Test
        run: dotnet test tests/ExcelReportTool.Tests -c Release --logger "console;verbosity=normal"
      - name: Run on the sample files
        run: dotnet run --project src/ExcelReportTool -c Release -- samples report.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: report.xlsx
